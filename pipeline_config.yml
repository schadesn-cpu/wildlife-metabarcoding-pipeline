# ============================================================
#  pipeline_config.yml
#  Wildlife Metabarcoding Pipeline — Central Configuration
#  MEED Lab, University of New Hampshire
#
#  This is the ONLY file you need to edit for a new project.
#  All pipeline scripts read their parameters from here.
#
#  Quick start:
#    1. Copy this file to your project root and rename it
#       pipeline_config.yml  (the pipeline looks for that name)
#    2. Set project.root to your project directory
#    3. Fill in your markers, metadata paths, and groups
#    4. Run:  python pipeline.py check   (validates your config)
#    5. Run:  python pipeline.py run --steps all
#
#  For full documentation:  python pipeline.py --help
# ============================================================

# ── Project identity ──────────────────────────────────────────────────────────
project:
  name: "my_metabarcoding_study"

  # Absolute path to your project root directory.
  # All relative paths below are resolved relative to this.
  # Use "." if running pipeline.py from the project root.
  root: "."

  # Contact email — used for NCBI Entrez access (required for
  # reference database building) and SLURM job notifications.
  email: "your@institution.edu"

# ── Sample naming ─────────────────────────────────────────────────────────────
# The pipeline needs to match long QIIME2 sample IDs like
# "TV230007-GI-16S_S1483_L002" back to short IDs in your metadata like "TV230007".
# Edit id_regex to match your naming convention.
#
# Examples:
#   TV-prefixed IDs:  "(TV\\d+)"        matches TV230007
#   All caps alpha:   "([A-Z]{2}\\d+)"  matches AB1234
#   Any prefix:       "(\\w+-\\d+)"     matches SAMPLE-001
samples:
  id_regex: "(TV\\d+)"
  control_prefixes:
    - "NTC-"
    - "PAC-"
    - "XB-"

# ── Active markers ────────────────────────────────────────────────────────────
# List only the markers you ran. Others are ignored.
# Must match keys in the 'markers' section below.
active_markers:
  - "16S"
  - "MiFish"
  - "cytb"
  - "18S"

# ── Per-marker configuration ──────────────────────────────────────────────────
# Add one block per marker. Keys must match active_markers list above.
markers:

  16S:
    description:       "Bacterial 16S rRNA V4 (515F/806R, SILVA 138)"
    classifier:        "classifiers/silva-138-99-nb-classifier-515-806.qza"
    rarefaction_depth: 8000
    phylo:             true    # enables Faith PD and UniFrac (requires rooted tree)
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
      - "weighted_unifrac"
      - "unweighted_unifrac"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"
      - "faith_pd"

  MiFish:
    description:       "Fish 12S MiFish-U (MitoFish + host)"
    classifier:        "classifiers/mitofish-12S-mifish-gavia-classifier.qza"
    rarefaction_depth: 17000
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

  cytb:
    description:       "Vertebrate cytochrome b (NCBI custom)"
    classifier:        "classifiers/ncbi-cytb-vertebrata-classifier.qza"
    rarefaction_depth: 200
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

  18S:
    description:       "Eukaryote 18S V9 (PR2 v5 / SILVA 138)"
    classifier:        "classifiers/silva-138-V9-classifier.qza"
    rarefaction_depth: 1000
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

# ── Metadata file paths ───────────────────────────────────────────────────────
# Paths relative to project.root.
# 'all'     : full sample set (primary diversity analysis)
# 'cod'     : cause-of-death filtered subset (secondary analysis)
#
# For a simpler study with only one grouping, set both 'all' and 'cod'
# to the same file and leave cod_groups empty below.
metadata:
  16S:
    all: "metadata/qiime/metadata_16S.tsv"
    cod: "metadata/qiime/metadata_16S_cod.tsv"
  MiFish:
    all: "metadata/qiime/metadata_MiFish.tsv"
    cod: "metadata/qiime/metadata_MiFish_cod_filtered_clean.tsv"
  cytb:
    all: "metadata/qiime/metadata_cytb.tsv"
    cod: "metadata/qiime/metadata_cytb_cod_filtered.tsv"
  18S:
    all: "metadata/qiime/metadata_18S.tsv"
    cod: "metadata/qiime/metadata_18S_cod_filtered.tsv"

# ── Study groups ──────────────────────────────────────────────────────────────
# Define the grouping columns and group orders for your study.
# These drive the group ordering in all figures and statistical tests.
#
# 'primary':    main comparison (DvT in the loon study = Diseased vs Trauma)
# 'secondary':  secondary grouping (COD = cause-of-death categories)
# 'seasonal':   seasonal grouping (must match values in your Season metadata column)
#
# If your study has no secondary grouping, leave secondary.order empty ([]).
groups:

  primary:
    column: "Group"
    order:
      - "Diseased"
      - "Trauma"
      - "Marine"
    # Two-group comparison subset (must be a subset of 'order' above)
    dvt_order:
      - "Diseased"
      - "Trauma"

  secondary:
    column: "COD_broad"
    order:
      - "Lead"
      - "Parasitic_Infectious"
      - "Trauma"

  seasonal:
    column: "Season"
    order:
      - "Breeding"
      - "Freshwater_Nonbreeding"
      - "Saltwater"

# ── QIIME2 core-metrics output paths ──────────────────────────────────────────
# Generated by qiime diversity core-metrics[-phylogenetic].
# Set per marker and per analysis type.
# Paths relative to project.root.
diversity_dirs:
  16S:
    DvT:    "qiime2/16S/rarefied_8000/DvT/diversity/core_metrics_depth8000"
    season: "qiime2/16S/rarefied_8000/season/diversity/core_metrics_depth8000"
  MiFish:
    DvT:    "qiime2/MiFish/rarefied_17000/DvT/diversity/core-metrics-17000"
    season: "qiime2/MiFish/rarefied_17000/season/diversity/core-metrics-17000"
  cytb:
    DvT:    "qiime2/cytb/all/diversity/core-metrics-200"
    season: "qiime2/cytb/all/diversity/core-metrics-200"
  18S:
    DvT:    "qiime2/18S/all/diversity/core-metrics-1000"
    season: "qiime2/18S/all/diversity/core-metrics-1000"

# ── Figure settings ───────────────────────────────────────────────────────────
figures:
  # Color palette for all figures.
  # Options: "wong" (colorblind-safe, citable), "purple", "redblue"
  # Wong 2011 is recommended for publication.
  palette: "wong"

  # Output directories (relative to project.root)
  annotated_dir:  "results/figures_annotated"   # with stats labels — for lab use
  manuscript_dir: "results/figures_manuscript"  # clean — for submission

# ── NCBI credentials ──────────────────────────────────────────────────────────
# Required for:
#   - 00_build_classifiers.py  (cytb, adenovirus, herpesvirus)
#   - MiFish --add-gavia       (loon host spike-in)
#
# Leave blank if you are not building reference databases from NCBI.
# An API key is optional but strongly recommended — get one free at:
#   https://www.ncbi.nlm.nih.gov/account/
ncbi:
  email:   ""
  api_key: ""

# ── SLURM settings ────────────────────────────────────────────────────────────
# Used when submitting jobs to an HPC cluster.
# Leave defaults if running locally.
slurm:
  partition: "shared"
  cpus:      16
  mem:       "64G"
  time:      "04:00:00"
  mail_type: "END,FAIL"
