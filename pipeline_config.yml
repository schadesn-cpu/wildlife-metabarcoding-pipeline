# ============================================================
#  pipeline_config.yml
#  Wildlife Metabarcoding Pipeline — Central Configuration
#  MEED Lab, University of New Hampshire
#
#  This is the ONLY file you need to edit for a new project.
#  All pipeline scripts read their parameters from here.
#
#  Quick start:
#    1. Copy this file to your project root and rename it
#       pipeline_config.yml  (the pipeline looks for that name)
#    2. Set project.root to your project directory
#    3. Fill in your markers, metadata paths, and groups
#    4. Run:  python pipeline.py check   (validates your config)
#    5. Run:  python pipeline.py run --steps all
#
#  For full documentation:  python pipeline.py --help
# ============================================================

# ── Project identity ──────────────────────────────────────────────────────────
project:
  name: "my_metabarcoding_study"

  # Absolute path to your project root directory.
  # All relative paths below are resolved relative to this.
  # Use "." if running pipeline.py from the project root.
  root: "."

  # Contact email — used for NCBI Entrez access (required for
  # reference database building) and SLURM job notifications.
  email: "your@institution.edu"

# ── Sample naming ─────────────────────────────────────────────────────────────
# The pipeline needs to match long QIIME2 sample IDs like
# "TV230007-GI-16S_S1483_L002" back to short IDs in your metadata like "TV230007".
# Edit id_regex to match your naming convention.
#
# Examples:
#   TV-prefixed IDs:  "(TV\\d+)"        matches TV230007
#   All caps alpha:   "([A-Z]{2}\\d+)"  matches AB1234
#   Any prefix:       "(\\w+-\\d+)"     matches SAMPLE-001
samples:
  id_regex: "(TV\\d+)"
  control_prefixes:
    - "NTC-"
    - "PAC-"
    - "XB-"

# ── Active markers ────────────────────────────────────────────────────────────
# List only the markers you ran. Others are ignored.
# Must match keys in the 'markers' section below.
active_markers:
  - "16S"
  - "MiFish"
  - "cytb"
  - "18S"

# ── Per-marker configuration ──────────────────────────────────────────────────
# Add one block per marker. Keys must match active_markers list above.
#
# Optional per-marker keys the pipeline will use if present:
#   amplicon_length: 253            # bp after primer removal (used by the advisors)
#   primers:                        # cutadapt primers — if omitted, the qc step's
#     front_f: "GTGYCAGCMGCCGCGGTAA"  #   detected primers (reports/primers_detected.tsv)
#     front_r: "GGACTACNVGGGTWTCTAAT" #   are used instead
# The engine itself takes no separate config file — pipeline_config.yml is the
# single source of truth; the orchestrator passes these through to QIIME.
markers:

  16S:
    description:       "Bacterial 16S rRNA V4 (515F/806R, SILVA 138)"
    classifier:        "classifiers/silva-138-99-nb-classifier-515-806.qza"
    rarefaction_depth: 8000
    phylo:             true    # enables Faith PD and UniFrac (requires rooted tree)
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
      - "weighted_unifrac"
      - "unweighted_unifrac"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"
      - "faith_pd"

  MiFish:
    description:       "Fish 12S MiFish-U (MitoFish + host)"
    classifier:        "classifiers/mitofish-12S-mifish-gavia-classifier.qza"
    rarefaction_depth: 17000
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

  cytb:
    description:       "Vertebrate cytochrome b (NCBI custom)"
    classifier:        "classifiers/ncbi-cytb-vertebrata-classifier.qza"
    rarefaction_depth: 200
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

  18S:
    description:       "Eukaryote 18S V9 (PR2 v5 / SILVA 138)"
    classifier:        "classifiers/silva-138-V9-classifier.qza"
    rarefaction_depth: 1000
    phylo:             false
    pcoa_metrics:
      - "bray_curtis"
      - "jaccard"
    alpha_metrics:
      - "observed_features"
      - "shannon"
      - "evenness"

# ── Metadata file paths ───────────────────────────────────────────────────────
# Paths relative to project.root.
# 'all'     : full sample set (primary diversity analysis)
# 'cod'     : cause-of-death filtered subset (secondary analysis)
#
# For a simpler study with only one grouping, set both 'all' and 'cod'
# to the same file and leave cod_groups empty below.
metadata:
  # Source sample sheet — your master sheet of sample-level info (one row per
  # sample). The metadata stage matches the long QIIME sample-ids (e.g.
  # TV230084-GI-16S_S1492) back to this sheet via samples.id_regex, then writes
  # the per-marker QIIME metadata TSVs below. Set both before running the
  # metadata stage; leave source_sheet blank to skip the stage (build by hand).
  source_sheet: ""                 # e.g. "metadata/source/sample_sheet.tsv"
  source_id_column: ""             # the column in that sheet holding the key, e.g. "SampleID"

  16S:
    all: "metadata/qiime/metadata_16S_ecoseason.tsv"
    cod: "metadata/qiime/metadata_16S_cod.tsv"
  MiFish:
    all: "metadata/qiime/metadata_MiFish.tsv"
    cod: "metadata/qiime/metadata_MiFish_cod_filtered_clean.tsv"
  cytb:
    all: "metadata/qiime/metadata_cytb.tsv"
    cod: "metadata/qiime/metadata_cytb_cod_filtered.tsv"
  18S:
    all: "metadata/qiime/metadata_18S.tsv"
    dvt: "metadata/qiime/metadata_18S_dvt.tsv"
    cod: "metadata/qiime/metadata_18S_cod_filtered.tsv"

# ── Study groups ──────────────────────────────────────────────────────────────
# Define the grouping columns and group orders for your study.
# These drive the group ordering in all figures and statistical tests.
#
# 'primary':    main comparison (DvT in the loon study = Diseased vs Trauma)
# 'secondary':  secondary grouping (COD = cause-of-death categories)
# 'seasonal':   seasonal grouping (must match values in your Season metadata column)
#
# If your study has no secondary grouping, leave secondary.order empty ([]).
groups:

  primary:
    column: "Group"
    order:
      - "Diseased"
      - "Trauma"
      - "Marine"
    # Two-group comparison subset (must be a subset of 'order' above)
    dvt_order:
      - "Diseased"
      - "Trauma"

  secondary:
    column: "COD_broad"
    order:
      - "Lead"
      - "Parasitic_Infectious"
      - "Trauma"

  # Confound-check variables for group_diversity — each is tested the same way as
  # the primary variable, so you can demonstrate your primary signal is NOT
  # actually driven by a batch / collection-source / season effect. Columns must
  # exist in your metadata. Leave empty to test only the primary; add columns
  # (e.g. [CollectionBatch, Source]) to enable confound checking. This is the
  # generalized replacement for the old loon-specific COD secondary analysis.
  confounds: []

  seasonal:
    column: "Season"
    order:
      - "Breeding"
      - "Freshwater_Nonbreeding"
      - "Saltwater"

# ── QIIME2 core-metrics output paths ──────────────────────────────────────────
# Paths are now DERIVED by the pipeline from each marker's rarefaction_depth
# (set per marker above) and the analysis name. For example, 16S at depth 8000
# resolves to:
#     qiime2/16S/diversity/r8000_DvT/core_metrics/
# You no longer hand-write these — that's what kept drifting out of sync.
# To override one path in an unusual case, you may still add a diversity_dirs
# block in the old "marker -> analysis -> path" form and it will take priority.

# ── Figure settings ───────────────────────────────────────────────────────────
figures:
  # Color palette for all figures.
  # Options: "wong" (colorblind-safe, citable), "purple", "redblue"
  # Wong 2011 is recommended for publication.
  palette: "wong"

  # Output directories (relative to project.root)
  annotated_dir:  "results/figures_annotated"   # with stats labels — for lab use
  manuscript_dir: "results/figures_manuscript"  # clean — for submission

# ── Optional analysis stages ──────────────────────────────────────────────────
# Toggle and parameterise the optional stages the orchestrator runs in addition
# to the core flow. Each is skipped loudly (logged, not silent) when disabled.
analyses:

  # Alpha-rarefaction curves to choose a sampling depth before the diversity
  # stage. Runs `qiime diversity alpha-rarefaction` per active marker and writes
  # an interactive .qzv, an annotated .png, and a per-sample read-count TSV to
  # results/<marker>/all/rarefaction/. The candidate depth defaults to each
  # marker's rarefaction_depth above.
  rarefaction:
    enabled: true
    max_depth:  20000   # max depth plotted on the curve
    steps:      20      # number of depth steps
    iterations: 10      # subsampling iterations per step

  # Presence/absence detection framework — for markers where relative read
  # abundance is not a defensible proxy for biological quantity (dietary /
  # detection markers especially). Consumes the taxonomy count table and writes
  # detection frequencies + barplots to results/<marker>/all/presence_absence/.
  # Grouping uses groups.primary.column + the per-marker metadata when present.
  presence_absence:
    enabled: true
    markers: [MiFish, cytb]   # markers to run P/A on (detection markers)
    min_sample_reads: 500     # drop samples below this many total reads
    min_taxon_reads:  50      # drop taxa below this many reads dataset-wide
    min_relabund:     0.0     # within-sample rel-abund floor before 0/1 (0 = off)
    top_n:            20      # taxa shown in barplots
    sample_label:     "sample"  # unit word in summaries (e.g. "loon", "tick")

  # BLAST refinement / QC — push under-resolved assignments down a rank, flag
  # classifier conflicts, and verify suspect taxa against a local NCBI nt (or
  # custom) database. OFF by default: it needs an external BLAST database whose
  # path you must set in `db` below, and BLAST+ (blastn) on PATH. Writes to
  # results/<marker>/all/blast/. `apply` writes a patched refined_taxonomy TSV —
  # leave it false and review the reports before trusting refined calls.
  blast:
    enabled: false
    markers: [MiFish, cytb]   # detection markers most prone to mis/under-calls
    db: ""                    # REQUIRED when enabled: path to local BLAST nt DB
    num_threads:      4       # blastn threads (shared by all BLAST tools)

    # blast_refine (07d) — push UNDER-resolved assignments down a rank.
    refine:
      target_rank:        genus   # refine assignments that stop above this rank
      min_pident:         97      # minimum percent identity for a usable hit
      max_target_seqs:    50      # BLAST hits kept per ASV
      max_asvs:           500     # safety cap on candidate ASVs per run
      min_confidence:     0.0     # classifier-confidence floor for candidates
      dominance_threshold: 0.70   # fraction one genus must hold to be promoted
      apply:              false   # write refined_taxonomy_<marker>.tsv (review first!)

    # blast_qc (07c) — flag classifier CONFLICTS (host/contaminant miscalled as
    # diet). NOTE: resolving taxids to names uses NCBI E-utilities (efetch/xtract)
    # → needs internet + those tools on PATH. Resolution is non-fatal: if offline,
    # the report still lists taxids, just without species names.
    qc:
      target_rank:     order   # ASVs not classified to this rank are BLASTed
      min_pident:      95      # minimum percent identity to call a conflict
      max_target_seqs: 5       # BLAST hits kept per ASV
      max_asvs:        200     # safety cap on ASVs to BLAST
      min_confidence:  0.80    # ASVs below this classifier confidence are BLASTed
      # Taxa whose presence signals a conflict (host DNA, contaminants, known
      # off-targets). Bacteria are universally off-target in dietary work; ADD
      # YOUR STUDY'S HOST genus/family here. Leave empty to rely on rank/confidence.
      conflict_taxa:
        - Bacteria
        - Proteobacteria
        - Enterobacteriaceae
        # Example (loon study v1): host + off-target birds — adapt to your system
        # - Gavia
        # - Gaviidae
        # - Buteo
        # - Haliaeetus
        # - Accipitridae

    # blast_verify (07b) — targeted verification of specific suspect taxa. For
    # automated runs it verifies every taxon at/above min_reads; for ad-hoc
    # checks pass --taxa on the command line. Compares the BLAST top hit to the
    # classifier call and flags agreements vs disagreements (advisory only —
    # it does not modify taxonomy).
    verify:
      min_reads:     10000   # verify taxa with >= this many total reads
      perc_identity: 85      # minimum percent identity for a hit
      max_hits:      5       # BLAST hits kept per query
      evalue:        0.001   # maximum e-value
      # taxa: [Brevoortia]   # optional explicit suspect taxon substrings

# ── NCBI credentials ──────────────────────────────────────────────────────────
# Required for:
#   - 00_build_classifiers.py  (cytb, adenovirus, herpesvirus)
#   - MiFish --add-gavia       (loon host spike-in)
#
# Leave blank if you are not building reference databases from NCBI.
# An API key is optional but strongly recommended — get one free at:
#   https://www.ncbi.nlm.nih.gov/account/
ncbi:
  email:   ""
  api_key: ""

# ── SLURM settings ────────────────────────────────────────────────────────────
# Used when submitting jobs to an HPC cluster.
# Leave defaults if running locally.
slurm:
  partition: "shared"
  cpus:      16
  mem:       "64G"
  time:      "04:00:00"
  mail_type: "END,FAIL"
